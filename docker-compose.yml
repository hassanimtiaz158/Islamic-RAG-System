# docker-compose.yml — Local development only
# Production uses Render (see render.yaml)
# Usage: docker-compose up --build

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: islamic-rag-app
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=islamic_rag
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
      - VECTOR_STORE_PATH=/app/data/vectorstore
      - ENVIRONMENT=development
      - DEBUG=true
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount vector store from host so it persists across restarts
      - vectorstore:/app/data/vectorstore
      # Mount source for hot-reload during development
      - ./src:/app/src:ro
      # Mount frontend for hot-reload during development
      - ./frontend:/app/frontend:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - islamic-rag-net

  mongo:
    image: mongo:7
    container_name: islamic-rag-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - islamic-rag-net

  redis:
    image: redis:7-alpine
    container_name: islamic-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - islamic-rag-net

volumes:
  mongo_data:
  redis_data:
  vectorstore:

networks:
  islamic-rag-net:
    driver: bridge
